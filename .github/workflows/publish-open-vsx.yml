name: Publish Open VSX

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-open-vsx
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run check
      - run: npm run package
      - name: Resolve package
        id: package
        run: node -e 'const p=require("./package.json"); require("node:fs").appendFileSync(process.env.GITHUB_OUTPUT, "file="+p.name+"-"+p.version+".vsix\n")'
      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: npx --yes ovsx@1.3.0 publish --packagePath "${{ steps.package.outputs.file }}"
